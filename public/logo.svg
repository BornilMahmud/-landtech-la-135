  <!-- Base Layered Near-Black Squircle -->
  <rect width="48" height="48" rx="12" fill="url(#sbDarkGrad)" />
  <rect x="0.5" y="0.5" width="47" height="47" rx="11.5" stroke="#27272a" stroke-width="1" />

  <!-- Cadastral Mouza Grid Blueprint Guidelines -->
  <path d="M12 16H36M12 24H36M12 32H36" stroke="#27272a" stroke-width="0.8" stroke-dasharray="1.5 1.5" />
  <path d="M16 12V36M24 12V36M32 12V36" stroke="#27272a" stroke-width="0.8" stroke-dasharray="1.5 1.5" />

  <!-- Isometric Land Parcel 1 (Bottom Ledger Layer) -->
  <polygon
    points="24,36 12,29 24,22 36,29"
    fill="#121215"
    stroke="#27272a"
    stroke-width="1.2"
  />

  <!-- Isometric Land Parcel 2 (Middle Verified Parcel) -->
  <polygon
    points="24,30 13,24 24,18 35,24"
    fill="#1b1b1f"
    stroke="url(#sbGoldGrad)"
    stroke-width="1.4"
  />

