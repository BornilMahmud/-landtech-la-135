<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sbDarkGrad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#1b1b1f" />
      <stop offset="100%" stopColor="#09090b" />
    </linearGradient>
    <linearGradient id="sbGoldGrad" x1="8" y1="8" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#f3e0b2" />
      <stop offset="50%" stopColor="#d4a657" />
      <stop offset="100%" stopColor="#9b6c2d" />
