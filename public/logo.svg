    stroke-linecap="round"
  />
  <circle cx="24" cy="7.5" r="2" fill="#d4a657" />

  <!-- Institutional Integrity Rings -->
  <circle cx="14" cy="18.5" r="1.5" fill="#4ade80" />
  <circle cx="34" cy="18.5" r="1.5" fill="#60a5fa" />
