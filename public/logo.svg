    fill-opacity="0.25"
    stroke="#d4a657"
    stroke-width="1.6"
  />

  <!-- Cryptographic Hash Verification Node at Center -->
  <circle cx="24" cy="18.5" r="2.8" fill="#d4a657" stroke="#09090b" stroke-width="1" />
  <circle cx="24" cy="18.5" r="1.2" fill="#09090b" />

  <!-- Smart Bhoomi Apex Node / Verification Beam -->
  <path
    d="M24 13V8"
    stroke="url(#sbGoldGrad)"
