  <!-- Cadastral Mouza Grid Blueprint Guidelines -->
  <path d="M12 16H36M12 24H36M12 32H36" stroke="#252422" stroke-width="0.8" stroke-dasharray="1.5 1.5" />
  <path d="M16 12V36M24 12V36M32 12V36" stroke="#252422" stroke-width="0.8" stroke-dasharray="1.5 1.5" />

